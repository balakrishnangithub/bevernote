[package]
name = "bevernote"
description = "Bevernote desktop and mobile application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bevernote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
bevernote-core = { path = "../crates/bevernote-core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Windows uses Credential Manager; this feature is target-gated by keyring.
keyring = { version = "3", features = ["windows-native"] }
tiny_http = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"
tauri-plugin-deep-link = "2.6.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
